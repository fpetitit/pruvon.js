<html>
<head>
    <link rel="stylesheet" href="../../test/pruvon.css" type="text/css" media="screen">
</head>
<body>
<h1>Splitting Names</h1>

<h2>First Name</h2>
<table data-execute="firstName">
    <tr>
        <th>Full Name</th>
        <th>First Name</th>
    </tr>
    <tr>
        <td>Jane Smith</td>
        <td>Jane</td>
    </tr>
    <tr>
        <td>Ada Lovelace</td>
        <td>Ada</td>
    </tr>
</table>

<h2>Last Name</h2>
<table data-execute="lastName">
    <tr>
        <th>Full Name</th>
        <th>Last Name</th>
    </tr>
    <tr>
        <td>Jane Smith</td>
        <td>Smith</td>
    </tr>
    <tr>
        <td>Ada Lovelace</td>
        <td>Lovelace</td>
    </tr>
</table>
</body>
</html>
